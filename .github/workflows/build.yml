name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu‑latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt‑get update
          sudo apt‑get install‑y git zip unzip openjdk‑17‑jdk‑headless autoconf libtool pkg‑config zlib1g‑dev libncurses5‑dev libncursesw5‑dev libssl‑dev libffi‑dev libsqlite3‑dev

      - name: Setup Python
        uses: actions/setup‑python@v5
        with:
          python‑version: "3.11"

      - name: Install buildozer
        run: pip install buildozer

      - name: Build debug APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload‑artifact@v4
        with:
          name: taichu‑v9‑apk
          path: ./bin/*.apk
          retention‑days: 30
