name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    container: kivy/buildozer:latest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk-headless autoconf automake autoconf-archive libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libssl-dev libffi-dev libsqlite3-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin pip and install build tooling
        run: |
          python -m pip install --upgrade pip==23.0.1 setuptools wheel
          pip install --upgrade buildozer python-for-android cython==0.29.36
      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
      - name: Clean old buildozer cache
        run: |
             buildozer android clean || true
             rm -rf .buildozer/android/platform/build-*/build/other_builds/python3
      - name: Build debug APK
        run: buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: taichu-v9-apk
          path: ./bin/*.apk
          retention-days: 30
